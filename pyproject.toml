[project]
name = "google-flow-mcp"
version = "0.1.0"
description = "MCP server for Google Agentspace Flow web automation"
requires-python = ">=3.14"
dependencies = [
    "mcp[cli]>=1.0,<2.0",
    "DrissionPage>=4.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "loguru>=0.7",
    "markdownify>=1.2.3",
    "debugpy>=1.8.21",
    "fastapi>=0.110.0",
    "grpcio>=1.62.0",
    "grpcio-tools>=1.62.0",
    "uvicorn>=0.27.0",
]

[project.scripts]
google-flow-mcp = "google_flow_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/google_flow_mcp"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
